name: Test and deploy Spotter

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spotter-robohouse-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Preflight, wait for idle, deploy and verify
        env:
          DEPLOY_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # Download only the trusted main commit's verification client. The
          # server independently fetches main, runs preflight and deploys it.
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/andlyu/blupe-spotter/$DEPLOY_SHA/blupe/deploy/wait_for_deploy.py" \
            --output /tmp/wait_for_deploy.py
          python3 /tmp/wait_for_deploy.py
