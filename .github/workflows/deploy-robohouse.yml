name: Test and deploy Spotter

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spotter-robohouse-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Preflight, wait for idle, deploy and verify
        env:
          DEPLOY_KEY: ${{ secrets.SPOTTER_ROBOHOUSE_DEPLOY_KEY }}
          DEPLOY_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY" || { echo 'Spotter deployment key is missing'; exit 1; }
          umask 077
          workdir=$(mktemp -d)
          trap 'rm -rf "$workdir"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$workdir/key"
          printf '%s\n' '54.209.185.15 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIONGrRJmdauPT5g+obIl73glgHRIafZvahKWahKUAbHc' > "$workdir/known_hosts"
          ssh -i "$workdir/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$workdir/known_hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            ubuntu@54.209.185.15 "deploy $DEPLOY_SHA"
